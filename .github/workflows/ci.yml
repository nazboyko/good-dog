name: ci
on: [push]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - run: test -f go.mod && go vet ./... || echo "no go module yet"
      - run: test -f go.mod && go test ./... || echo "no go module yet"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: test -f web/package.json && cd web && npm ci && npm run typecheck && npm test -- --run || echo "no web package yet"
